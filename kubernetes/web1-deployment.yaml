apiVersion: apps/v1
kind: Deployment
metadata:
  name: web1
  namespace: k8s-gitlab

spec:
  replicas: 1

  selector:
    matchLabels:
      app: web1

  template:
    metadata:
      labels:
        app: web1

    spec:
      containers:
      - name: web1
        image: {{ .Values.web1.image }}
        imagePullPolicy: Always

        resources:
          requests:
              cpu: "100m"
              memory: "128Mi"
          
          limits:
              cpu: "300m"
              memory: "256Mi"

        ports:
        - containerPort: 5000

        env:
        - name: REDIS_HOST
          value: redis  

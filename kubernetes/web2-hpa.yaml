apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler

metadata:
  name: web2-hpa
  namespace: k8s-gitlab

spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: web2

  minReplicas: 1
  maxReplicas: 5

  metrics:
  - type: Resource

    resource:
      name: cpu

      target:
        type: Utilization
        averageUtilization: 50
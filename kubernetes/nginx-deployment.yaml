apiVersion: apps/v1
kind: Deployment

metadata:
  name: nginx
  namespace: k8s-gitlab

spec:
  replicas: 1

  selector:
    matchLabels:
      app: nginx

  template:
    metadata:
      labels:
        app: nginx

    spec:
      containers:
      - name: nginx

        image: {{ .Values.nginx.image }}

        imagePullPolicy: Always

        ports:
        - containerPort: 80